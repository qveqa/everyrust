[package]
name = "everyrust"
version = "0.2.0"
edition = "2021"
description = "Fast local file search for Windows"
license = "MIT"

[[bin]]
name = "everyrust"
path = "src/main.rs"

[[bin]]
name = "everyrust-gui"
path = "src/bin/gui.rs"

[lib]
name = "everyrust"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = "0.4.45"
csv = "1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25", default-features = false, features = ["ico"] }
memchr = "2"
notify = "8.2.2"
rayon = "1"
regex = "1"
rfd = "0.18.0"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
